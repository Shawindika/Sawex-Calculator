<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="intro-screen">

    <div class="stars"></div>

    <div class="moon">🌙</div>
    <div class="earth">🌍</div>
    <div class="saturn">🪐</div>
    <div class="mars">🔴</div>
    <div class="comet">☄️</div>
    
    <h1 class="welcome-text">WELCOME</h1>
    <p class="welcome-sub">YOUR CALCULATOR IS READY</p>

<button id="enterBtn">ENTER →</button>
<div class="brand-name">POWERED BY SaweX</div>
</div>

</div>
    <div class="calculator">

        <h1>Calculator</h1>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="delete" onclick="deleteNumber()">DEL</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>

            <button class="zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
